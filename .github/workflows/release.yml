name: Create Release

on:
  release:
    types:
      - published

  # Allows an existing release to be rebuilt manually if required.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.3.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish HACS release
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'release'
            && github.event.release.tag_name
            || inputs.tag }}

    steps:
      - name: Checkout released source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"
          TAG_VERSION="${TAG#v}"
          MANIFEST="custom_components/tesla_serve_key/manifest.json"
          MANIFEST_VERSION="$(jq -er '.version' "$MANIFEST")"

          if [[ "$TAG" != v* ]]; then
            echo "Release tag must start with v."
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Tag version and manifest version do not match."
            echo "Tag:      $TAG_VERSION"
            echo "Manifest: $MANIFEST_VERSION"
            exit 1
          fi

          jq -e '
            .zip_release == true and
            .filename == "tesla_serve_key.zip" and
            .hide_default_branch == true
          ' hacs.json >/dev/null || {
            echo "hacs.json is not configured for the expected release ZIP."
            exit 1
          }

          test -f "$MANIFEST"
          test -f "custom_components/tesla_serve_key/__init__.py"

      - name: Build HACS release ZIP
        shell: bash
        working-directory: custom_components/tesla_serve_key
        run: |
          set -euo pipefail

          zip -r "$GITHUB_WORKSPACE/tesla_serve_key.zip" . \
            -x "__pycache__/*" \
               "*/__pycache__/*" \
               "*.pyc" \
               ".DS_Store"

      - name: Verify HACS installation layout
        shell: bash
        run: |
          set -euo pipefail

          ZIP="tesla_serve_key.zip"

          unzip -t "$ZIP"

          # Required files must be at the ZIP root.
          unzip -Z1 "$ZIP" | grep -qx "manifest.json"
          unzip -Z1 "$ZIP" | grep -qx "__init__.py"

          # Reject unwanted wrapper directories.
          if unzip -Z1 "$ZIP" |
            grep -Eq "^(tesla_serve_key/|custom_components/)"; then
            echo "ZIP contains an unwanted top-level directory."
            unzip -Z1 "$ZIP"
            exit 1
          fi

          # Simulate the HACS extraction destination.
          TEMP_ROOT="$(mktemp -d)"
          INSTALL_DIR="$TEMP_ROOT/config/custom_components/tesla_serve_key"

          mkdir -p "$INSTALL_DIR"
          unzip -q "$ZIP" -d "$INSTALL_DIR"

          test -f "$INSTALL_DIR/manifest.json"
          test -f "$INSTALL_DIR/__init__.py"

          jq -e '
            .domain == "tesla_serve_key" and
            (.version | type == "string")
          ' "$INSTALL_DIR/manifest.json" >/dev/null

          echo "Verified installation layout:"
          find "$INSTALL_DIR" -maxdepth 2 -type f | sort

      - name: Add ZIP to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: tesla_serve_key.zip
          fail_on_unmatched_files: true
          overwrite_files: true
